name: Keep Supabase Alive

on:
  schedule:
    # รันอัตโนมัติทุก 3 วัน เวลา 00:00 UTC (07:00 น. เวลาไทย)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # ปุ่มสำหรับกดทดสอบรันด้วยตัวเองใน GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          echo "Supabase responded with HTTP status: $HTTP_STATUS"
